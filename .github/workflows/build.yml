name: Build ForceSpeaker

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@main
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
      - name: Build rootless package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ForceSpeaker-rootless
          path: packages/*.deb
          if-no-files-found: error
